<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Light Switch</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #10131c;
      color: #f5f6fa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 50% 35%, #20283a 0, transparent 48%),
        #10131c;
      transition: background 400ms ease;
    }

    .room {
      width: min(100%, 360px);
      padding: 36px 28px 32px;
      text-align: center;
      background: rgb(255 255 255 / 5%);
      border: 1px solid rgb(255 255 255 / 10%);
      border-radius: 24px;
      box-shadow: 0 24px 70px rgb(0 0 0 / 28%);
    }

    h1 {
      margin: 0;
      font-size: 1.65rem;
      font-weight: 650;
      letter-spacing: -0.03em;
    }

    .hint {
      margin: 8px 0 28px;
      color: #a6adbd;
      font-size: 0.95rem;
    }

    .bulb {
      display: block;
      width: 150px;
      height: 190px;
      margin: 0 auto 18px;
      overflow: visible;
      color: #687083;
      transition: color 350ms ease, filter 350ms ease;
    }

    .bulb-glass {
      fill: currentColor;
      stroke: #9299a8;
      stroke-width: 3;
      transition: fill 350ms ease, stroke 350ms ease;
    }

    .bulb-base {
      fill: #737b8a;
      transition: fill 350ms ease;
    }

    .room.is-on .bulb {
      color: #ff5a5a;
      filter: drop-shadow(0 0 18px rgb(255 211 90 / 70%));
    }

    .room.is-on .bulb-glass {
      fill: #ffe28a;
      stroke: #fff0bd;
    }

    .room.is-on .bulb-base {
      fill: #c5a54e;
    }

    .status {
      min-height: 1.5em;
      margin: 0 0 22px;
      color: #a6adbd;
      font-size: 0.9rem;
    }

    .room.is-on .status {
      color: #ffe28a;
    }

    .switch-row {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      user-select: none;
    }

    .switch {
      position: relative;
      width: 62px;
      height: 34px;
      flex: none;
    }

    .switch input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    .track {
      position: absolute;
      inset: 0;
      border: 1px solid #51596b;
      border-radius: 999px;
      background: #343a49;
      transition: background 200ms ease, border-color 200ms ease;
    }

    .track::after {
      position: absolute;
      top: 4px;
      left: 4px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #f5f6fa;
      content: "";
      transition: transform 200ms ease;
    }

    .switch input:checked + .track {
      border-color: #e8bd4c;
      background: #c99e2e;
    }

    .switch input:checked + .track::after {
      transform: translateX(28px);
    }

    .switch input:focus-visible + .track {
      outline: 3px solid #91baff;
      outline-offset: 4px;
    }

    .switch-label {
      min-width: 28px;
      color: #f5f6fa;
      font-weight: 600;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="room" id="room">
    <h1>Light switch</h1>
    <p class="hint">Flip the switch to change the light.</p>

    <svg class="bulb" viewBox="0 0 120 160" aria-hidden="true">
      <path class="bulb-glass" d="M60 8a42 42 0 0 0-25 76c7 5 10 12 11 19h28c1-7 4-14 11-19A42 42 0 0 0 60 8Z"/>
      <path class="bulb-base" d="M46 108h28v8H46zm2 12h24v7H48zm5 11h14l-4 8h-6z"/>
      <path d="M47 98h26" fill="none" stroke="#9299a8" stroke-linecap="round" stroke-width="3"/>
    </svg>

    <p class="status" id="status" aria-live="polite">The light is off.</p>

    <label class="switch-row">
      <span class="switch">
        <input id="light-switch" type="checkbox" role="switch" aria-label="Light">
        <span class="track" aria-hidden="true"></span>
      </span>
      <span class="switch-label" id="switch-label">Off</span>
    </label>
  </main>

  <script>
    const room = document.querySelector("#room");
    const lightSwitch = document.querySelector("#light-switch");
    const status = document.querySelector("#status");
    const switchLabel = document.querySelector("#switch-label");

    lightSwitch.addEventListener("change", () => {
      const isOn = lightSwitch.checked;
      room.classList.toggle("is-on", isOn);
      status.textContent = `The light is ${isOn ? "on" : "off"}.`;
      switchLabel.textContent = isOn ? "On" : "Off";
    });
  </script>
</body>
</html>
